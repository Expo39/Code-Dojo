<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept graph</title>
<!-- Code Dojo concept graph: written by `python dojo.py graph --html` (dojolib/graph.py).
     One file, no network. Overview first (tracks and modules), then zoom into concepts
     (Map: one island per module; Flow: a layered left-to-right drawing), details on demand. -->
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--surface-2:#efeee9;--fg:#1c1c1a;--muted:#6d6c66;--line:#dcdad3;
  --edge:#b4b2a9;--accent:#2563eb;--shadow:0 8px 30px rgba(20,20,10,.10);
  --fluent:#15803d;--held:#0e7490;--due:#b45309;--fragile:#ea580c;--misconception:#dc2626;
  --gap:#be185d;--ready:#7c3aed;--unknown:#a3a39c;--planned:#d4d4d0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211;--surface:#1c1c1a;--surface-2:#262624;--fg:#ecebe6;--muted:#a19f97;--line:#34332f;
  --edge:#4d4c47;--accent:#60a5fa;--shadow:0 8px 30px rgba(0,0,0,.45);
  --fluent:#22c55e;--held:#22b8cf;--due:#f59e0b;--fragile:#fb923c;--misconception:#f87171;
  --gap:#f472b6;--ready:#a78bfa;--unknown:#6b6b66;--planned:#3a3a37;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211;--surface:#1c1c1a;--surface-2:#262624;--fg:#ecebe6;--muted:#a19f97;--line:#34332f;
  --edge:#4d4c47;--accent:#60a5fa;--shadow:0 8px 30px rgba(0,0,0,.45);
  --fluent:#22c55e;--held:#22b8cf;--due:#f59e0b;--fragile:#fb923c;--misconception:#f87171;
  --gap:#f472b6;--ready:#a78bfa;--unknown:#6b6b66;--planned:#3a3a37;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}canvas.pointing{cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.fade{transition:opacity .25s ease,transform .25s ease}
#bar{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;z-index:4}
#crumbs{display:flex;align-items:center;gap:6px;font-weight:600;margin:0 4px;white-space:nowrap}
#crumbs button{border:0;background:transparent;padding:2px 4px;border-radius:6px;cursor:pointer;font-weight:600}
#crumbs button:hover{background:var(--surface-2)}
#crumbs .sep{color:var(--muted);font-weight:400}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 10px;cursor:pointer}
.btn:hover,.seg button:hover{color:var(--fg)}
.spacer{flex:1}
#searchwrap{position:relative;flex:1 1 180px;max-width:300px;min-width:140px}
#search{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 10px 5px 30px}
#searchwrap::before{content:"⌕";position:absolute;left:10px;top:4px;color:var(--muted)}
#results{position:absolute;top:36px;left:0;right:0;max-height:320px;overflow:auto;padding:4px;display:none}
#results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer}
#results button:hover,#results button.on{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.sub{color:var(--muted);font-size:12px}
#nextup{position:fixed;left:12px;bottom:14px;width:290px;padding:12px 12px 8px;z-index:3}
#nextup h2,#legend h2,#panel h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#nextup button.row{display:flex;gap:9px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:6px;border-radius:8px;cursor:pointer}
#nextup button.row:hover{background:var(--surface-2)}
#nextup .row .dot{margin-top:4px}
#nextup .x{position:absolute;right:8px;top:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
#legend{position:fixed;right:12px;top:72px;width:260px;padding:12px;z-index:3;max-height:calc(100% - 160px);overflow:auto;display:none}
#legend.open{display:block}
#legend h2{margin-top:12px}#legend h2:first-child{margin-top:0}
.chip{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:3px 6px;border-radius:7px;cursor:pointer;text-align:left}
.chip:hover{background:var(--surface-2)}.chip[aria-pressed="false"]{opacity:.38}
.chip .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .desc{display:block;font-size:11.5px;color:var(--muted)}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0;cursor:pointer}
.keys{font-size:12px;color:var(--muted);line-height:1.75}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font:11px ui-monospace,monospace;background:var(--surface-2)}
#panel{position:fixed;right:12px;top:72px;width:360px;max-height:calc(100% - 90px);overflow:auto;padding:16px;z-index:3;
  transform:translateX(calc(100% + 24px));transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#panel .state{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
#panel h2{font-size:19px;margin:2px 0;line-height:1.25}
#panel h3{margin-top:14px}
#panel .close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted)}
#panel .can{background:var(--surface-2);border-radius:9px;padding:10px 12px;margin:10px 0}
#panel .next{border:1px solid var(--accent);border-radius:9px;padding:8px 12px;margin:10px 0}
#panel .next b{color:var(--accent);display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#panel code{font:13px ui-monospace,monospace}
#panel ul{list-style:none;padding:0;margin:0}
#panel li button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:4px 6px;border-radius:7px;cursor:pointer}
#panel li button:hover{background:var(--surface-2)}
#panel .actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:8px 0 4px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);margin-left:4px}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0;font-size:13px}.ev .sub{display:block}
#tip{position:fixed;pointer-events:none;z-index:5;max-width:280px;padding:9px 11px;opacity:0;transform:translateY(4px)}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-size:13.5px}#tip .st{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
#tip p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
#focusbar{position:fixed;left:50%;top:72px;transform:translateX(-50%);padding:6px 10px;display:none;align-items:center;gap:8px;z-index:3}
#focusbar.on{display:flex}
#zoom{position:fixed;right:12px;bottom:14px;display:flex;flex-direction:column;z-index:3}
#zoom button{border:0;background:transparent;width:34px;height:32px;cursor:pointer;font-size:17px}
#zoom button+button{border-top:1px solid var(--line)}
#guide{position:fixed;z-index:6;width:320px;padding:16px 16px 12px;display:none}
#guide.on{display:block}
#guide h2{font-size:16px;margin:0 0 6px}
#guide p{margin:0 0 12px}
#guide .foot{display:flex;align-items:center;gap:8px}
#guide .steps{color:var(--muted);font-size:12px;margin-right:auto}
.lit-target{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
@media (max-width:760px){
  #crumbs{display:none}
  #nextup{width:auto;right:60px}
  #legend{top:auto;bottom:60px;left:12px;right:12px;width:auto;max-height:50%}
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:62%;border-radius:14px 14px 0 0;transform:translateY(105%)}
  #panel.open{transform:none}
  #focusbar{top:auto;bottom:62px}
  #guide{left:12px!important;right:12px;width:auto;top:auto!important;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.still *{transition:none!important}
#panel.open ~ #zoom{right:384px}
@media (max-width:760px){#panel.open ~ #zoom{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Concept graph"></canvas></div>

<header id="bar" class="card">
  <nav id="crumbs" aria-label="Where you are"></nav>
  <div class="seg" id="views" role="group" aria-label="Which tracks"></div>
  <div class="seg" id="layouts" role="group" aria-label="View">
    <button data-layout="overview" title="Tracks and modules, with your progress (O)">Overview</button>
    <button data-layout="map" title="Concepts grouped by module (M)">Map</button>
    <button data-layout="flow" title="What leads to what, left to right (L)">Flow</button>
  </div>
  <div id="searchwrap"><input id="search" type="search" placeholder="Search concepts  /" aria-label="Search concepts" autocomplete="off">
    <div id="results" class="card" role="listbox"></div></div>
  <span class="spacer"></span>
  <button class="btn" id="legendbtn" aria-expanded="false" title="States, filters and keys">Legend</button>
  <button class="btn" id="fit" title="Fit everything (F)">Fit</button>
  <button class="btn" id="theme" title="Light or dark" aria-label="Light or dark">◐</button>
  <button class="btn" id="help" title="Show the guide again" aria-label="Guide">?</button>
</header>

<aside id="nextup" class="card fade" aria-label="Next up"></aside>

<aside id="legend" class="card" aria-label="Legend and filters">
  <h2 id="summaryhead">Your graph</h2>
  <div class="sub" id="summary"></div>
  <h2>States (click to show or hide)</h2>
  <div id="states"></div>
  <h2>Show</h2>
  <label class="toggle"><input type="checkbox" id="showPlanned"> modules not built yet</label>
  <label class="toggle"><input type="checkbox" id="showRegions" checked> module regions (Map)</label>
  <h2>Reading it</h2>
  <div class="keys" id="keys"></div>
  <button class="btn" id="relayout" style="margin-top:10px">Forget moved positions</button>
</aside>

<div id="focusbar" class="card">
  <span id="focuslabel"></span>
  <div class="seg" id="depths" role="group" aria-label="How far around">
    <button data-depth="1">1 step</button><button data-depth="2">2 steps</button><button data-depth="99">all linked</button>
  </div>
  <button class="btn" id="unfocus">Show everything</button>
</div>

<aside id="panel" class="card" aria-live="polite"></aside>
<div id="tip" class="card fade" role="tooltip"></div>
<div id="zoom" class="card"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
<section id="guide" class="card fade" role="dialog" aria-label="Guide"></section>

<script>
"use strict";
const DATA = __DATA__;
const STATES = [
  ["fluent","fluent","you use it without help"],
  ["held","held","understood"],
  ["due","due","held, a redo is due"],
  ["fragile","fragile","shaky: one more check"],
  ["misconception","misconception","sure but wrong: fix first"],
  ["gap","gap","not known yet"],
  ["ready","ready","you can start it now"],
  ["unknown","not yet","waits on something first"],
  ["planned","planned","module not built yet"]];
const RING = ["fluent","held","due","fragile","misconception","gap","ready","unknown","planned"];
const SOLID = new Set(["fluent","held","due"]);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches || location.hash === "#still";  // #still: no motion (screenshots)
if (location.hash === "#still") document.documentElement.classList.add("still");
const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem("dojo-graph:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem("dojo-graph:"+k,JSON.stringify(v))}catch(e){}}};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ease = u => 1 - Math.pow(1 - u, 3);
const pretty = g => g.replace(/^.*\//, "").replace(/^m\d\d_/, "").replace(/_/g, " ");
function hashString(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}

// ------------------------------------------------------------------ state
const canvas = $("#c"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, colours = {};
let view = null, layout = store.get("layout", "overview");
let cam = {k:1, x:0, y:0};
let hidden = new Set(store.get("hidden", [])), showPlanned = store.get("planned", false), showRegions = true;
let hover = null, selected = null, focus = null, focusDepth = 1, pathTo = null, openGroup = null;
let alpha = 0, dirty = true, blend = layout === "overview" ? 0 : 1;   // 0 = overview drawn, 1 = concepts drawn
const anims = new Set();
function animate(ms, step, done){
  if (REDUCED || !ms){ step(1); if (done) done(); dirty = true; return; }
  let t0 = null; const a = t => { if (t0 === null) t0 = t; const u = Math.min(1, (t - t0) / ms); step(ease(u)); dirty = true;
    if (u >= 1){ anims.delete(a); if (done) done(); } };
  anims.add(a);
}
function readColours(){
  const cs = getComputedStyle(document.documentElement);
  for (const v of ["bg","surface","surface-2","fg","muted","line","edge","accent",...STATES.map(s=>s[0])]) colours[v] = cs.getPropertyValue("--"+v).trim();
  dirty = true;
}
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };

// ------------------------------------------------------------------ data → view
function buildView(key){
  const src = DATA.views[key];
  const nodes = src.nodes.map(n => ({...n, x:0, y:0, vx:0, vy:0, fx:null, fy:null}));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = [];
  for (const n of nodes){ n.out = []; n.in = []; }
  for (const n of nodes) for (const r of n.requires){ const s = byId.get(r); if (s){ links.push({s, t:n}); s.out.push(n); n.in.push(s); } }
  const depth = new Map(), seen = new Set();
  const d = n => { if (depth.has(n.id)) return depth.get(n.id); if (seen.has(n.id)) return 0; seen.add(n.id);
    const v = n.in.length ? 1 + Math.max(...n.in.map(d)) : 0; depth.set(n.id, v); return v; };
  nodes.forEach(n => { n.depth = d(n); n.r = 6 + 2.4 * Math.sqrt(n.out.length); });
  // modules: the overview's bubbles and the Map's islands
  const order = [...new Set(nodes.map(n => n.group))];
  const modules = order.map((g, i) => ({id: g, name: pretty(g), track: nodes.find(n => n.group === g).track, order: i,
                                        nodes: nodes.filter(n => n.group === g), x: 0, y: 0, in: [], out: []}));
  const mById = new Map(modules.map(m => [m.id, m]));
  const mlinks = new Map();
  for (const {s, t} of links) if (s.group !== t.group){ const k = s.group + "→" + t.group;
    if (!mlinks.has(k)) mlinks.set(k, {s: mById.get(s.group), t: mById.get(t.group), w: 0}); mlinks.get(k).w++; }
  for (const l of mlinks.values()){ l.s.out.push(l.t); l.t.in.push(l.s); }
  const md = new Map(), mseen = new Set();
  const dm = m => { if (md.has(m.id)) return md.get(m.id); if (mseen.has(m.id)) return 0; mseen.add(m.id);
    const v = m.in.length ? 1 + Math.max(...m.in.map(dm)) : 0; md.set(m.id, v); return v; };
  modules.forEach((m, i) => { m.depth = dm(m); m.hue = Math.round((i * 137.508) % 360);
    m.counts = {}; for (const n of m.nodes) m.counts[n.state] = (m.counts[n.state] || 0) + 1;
    m.planned = m.nodes.every(n => n.planned); m.r = 16 + 5 * Math.sqrt(m.nodes.length);
    m.solid = m.nodes.filter(n => SOLID.has(n.state)).length; m.ready = m.counts.ready || 0; });
  nodes.forEach(n => { n.mod = mById.get(n.group); n.hue = n.mod.hue; });
  // Map: one island per module on a grid in syllabus order, one block per track
  const tracks = [...new Set(modules.map(m => m.track))];
  const cell = 80 + 34 * Math.sqrt(Math.max(...modules.map(m => m.nodes.length)));
  let yOff = 0;
  for (const t of tracks){
    const ms = modules.filter(m => m.track === t), cols = Math.max(1, Math.round(Math.sqrt(ms.length * 1.5)));
    ms.forEach((m, i) => { m.ax = (i % cols) * cell * 1.25; m.ay = yOff + Math.floor(i / cols) * cell; });
    yOff += (Math.ceil(ms.length / cols) + .9) * cell;
  }
  nodes.forEach(n => { n.ax = n.mod.ax; n.ay = n.mod.ay; n.x = n.ax + (hashString(n.id) - .5) * 80; n.y = n.ay + (hashString(n.id+"y") - .5) * 80; });
  return {key, label: src.label, summary: src.summary, tracks: src.tracks, next: src.next, nodes, links, byId,
          modules, mById, mlinks: [...mlinks.values()]};
}
function visible(n){
  if (!showPlanned && n.state === "planned") return false;
  if (hidden.has(n.state)) return false;
  if (focus && !focus.set.has(n.id)) return false;
  return true;
}
const mvisible = m => showPlanned || !m.planned;

// ------------------------------------------------------------------ layouts
// Layered drawing (Sugiyama): layers by prerequisite depth, barycentre sweeps to cut crossings,
// then each layer's spacing nudged towards its neighbours without changing the order.
function layered(items, edges, col, gap){
  const layers = new Map();
  for (const it of items){ if (!layers.has(it.depth)) layers.set(it.depth, []); layers.get(it.depth).push(it); }
  const depths = [...layers.keys()].sort((a, b) => a - b);
  const preds = new Map(items.map(i => [i.id, []])), succs = new Map(items.map(i => [i.id, []]));
  for (const [a, b] of edges) if (preds.has(b) && succs.has(a)){ preds.get(b).push(a); succs.get(a).push(b); }
  const pos = new Map();
  for (const d of depths){ layers.get(d).sort((p, q) => p.order0 - q.order0); layers.get(d).forEach((it, i) => pos.set(it.id, i)); }
  const bary = (id, nb) => { const ns = nb.get(id); return ns.length ? ns.reduce((s, x) => s + pos.get(x), 0) / ns.length : pos.get(id); };
  for (let iter = 0; iter < 16; iter++){
    const down = iter % 2 === 0, seq = down ? depths.slice(1) : depths.slice(0, -1).reverse();
    for (const d of seq){ const L = layers.get(d), b = new Map(L.map(it => [it.id, bary(it.id, down ? preds : succs)]));
      L.sort((p, q) => b.get(p.id) - b.get(q.id) || p.order0 - q.order0); L.forEach((it, i) => pos.set(it.id, i)); }
  }
  const y = new Map();
  for (const d of depths){ const L = layers.get(d); const tot = L.reduce((s, it) => s + it.h, 0) + (L.length - 1) * gap;
    let cur = -tot / 2; for (const it of L){ y.set(it.id, cur + it.h / 2); cur += it.h + gap; } }
  for (let iter = 0; iter < 24; iter++){
    for (const d of (iter % 2 ? depths.slice().reverse() : depths)){
      const L = layers.get(d);
      const want = L.map(it => { const ns = [...preds.get(it.id), ...succs.get(it.id)];
        return ns.length ? ns.reduce((s, x) => s + y.get(x), 0) / ns.length : y.get(it.id); });
      const ys = L.map((it, i) => (y.get(it.id) + want[i]) / 2);
      for (let i = 1; i < L.length; i++){ const min = ys[i-1] + (L[i-1].h + L[i].h) / 2 + gap; if (ys[i] < min) ys[i] = min; }
      const shift = (want.reduce((a, b) => a + b, 0) - ys.reduce((a, b) => a + b, 0)) / L.length;
      L.forEach((it, i) => y.set(it.id, ys[i] + shift));
    }
  }
  return new Map(items.map(it => [it.id, {x: it.depth * col, y: y.get(it.id)}]));
}
function overviewPositions(){
  const out = new Map(); let yOff = 0;
  for (const t of Object.keys(view.tracks)){
    const ms = view.modules.filter(m => m.track === t && mvisible(m)); if (!ms.length) continue;
    const items = ms.map(m => ({id: m.id, depth: m.depth, order0: m.order, h: m.r * 2 + 44}));
    const edges = view.mlinks.filter(l => mvisible(l.s) && mvisible(l.t)).map(l => [l.s.id, l.t.id]);
    const pos = layered(items, edges, 210, 18);
    let y0 = Infinity, y1 = -Infinity; for (const p of pos.values()){ y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    for (const [id, p] of pos) out.set(id, {x: p.x, y: p.y - y0 + yOff});
    yOff += (y1 - y0) + 260;
  }
  return out;
}
function flowPositions(){

    if (drag.node && drag.moved){ const [x, y] = toWorld(e.offsetX, e.offsetY);
      if (layout === "map"){ drag.node.fx = x; drag.node.fy = y; alpha = Math.max(alpha, .25); } else { drag.node.x = x; drag.node.y = y; dirty = true; } }
    else if (drag.pan && drag.moved){ if (camAnim){ anims.delete(camAnim); camAnim = null; } cam.x = e.offsetX - drag.pan[0]; cam.y = e.offsetY - drag.pan[1]; dirty = true; }
    return;
  }
  const h = pick(e.offsetX, e.offsetY);
  const same = (h && hover && h.item === hover.item) || (!h && !hover);
  if (!same){ hover = h; canvas.classList.toggle("pointing", !!h); dirty = true; hideTip();
    if (h){ tipTimer = setTimeout(() => showTip(h, e.clientX, e.clientY), 140); } }
  else if (h) placeTip(e.clientX, e.clientY);
});
function endPointer(e){
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; canvas.classList.remove("dragging");
  if (!drag) return;
  if (drag.node && drag.moved && layout === "map"){ drag.node.pinned = true; savePins(); }
  if (!drag.moved){ const h = drag.hit;
    if (h && h.kind === "module") openModule(h.item);
    else if (h) select(h.item);
    else { select(null); if (openGroup){ openGroup = null; renderCrumbs(); dirty = true; } } }
  drag = null;
}
canvas.addEventListener("pointerup", endPointer); canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => { if (!drag && hover){ hover = null; hideTip(); dirty = true; } });
canvas.addEventListener("dblclick", e => { const h = pick(e.offsetX, e.offsetY); if (h && h.kind === "node") setFocus(h.item, focusDepth); else if (!h) fitCurrent(); });
canvas.addEventListener("wheel", e => { e.preventDefault(); userMoved = true; hideTip(); zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0016))); }, {passive: false});
function savePins(){ const saved = {}; for (const n of view.nodes) if (n.pinned) saved[n.id] = [Math.round(n.x), Math.round(n.y)]; store.set("pos:" + view.key, saved); }

// hover card: what it is and what a click does, after a short pause
const tip = $("#tip");
function barHtml(m){ return RING.filter(s => m.counts[s]).map(s => `<span style="flex:${m.counts[s]};background:var(--${s})"></span>`).join(""); }
function showTip(h, cx, cy){
  if (h.kind === "module"){ const m = h.item;
    tip.innerHTML = `<b>${esc(m.name)}</b><div class="bar">${barHtml(m)}</div><p>${m.solid} of ${m.nodes.length} concepts solid${m.ready ? ` · ${m.ready} ready to start` : ""}${m.planned ? " · not built yet" : ""}</p><p>Click to open it.</p>`;
  } else { const n = h.item, [, label] = stateInfo(n.state);
    tip.innerHTML = `<span class="st" style="color:var(--${n.state})">${esc(label)}</span><b>${esc(n.name)}</b>${n.can ? `<p>${esc(n.can)}</p>` : ""}<p>${n.action ? "Next: " + esc(n.action) + " · " : ""}click for details</p>`; }
  tip.classList.add("on"); placeTip(cx, cy);
}
function placeTip(cx, cy){ const r = tip.getBoundingClientRect(); let x = cx + 16, y = cy + 16;
  if (x + r.width > innerWidth - 8) x = cx - r.width - 16; if (y + r.height > innerHeight - 8) y = cy - r.height - 16;
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip(){ clearTimeout(tipTimer); tip.classList.remove("on"); }

// ------------------------------------------------------------------ open a module, select, focus
function openModule(m){
  openGroup = m.id;
  if (layout === "overview") setLayout(store.get("conceptLayout", "map"), {group: m.id});
  else fitCurrent();
  renderCrumbs(); dirty = true;
}
function stateInfo(s){ return STATES.find(x => x[0] === s) || [s, s, ""]; }
function select(n, centre = false){
  selected = n; pathTo = null; dirty = true;
  const panel = $("#panel");
  if (!n){ panel.classList.remove("open"); return; }
  $("#legend").classList.remove("open"); $("#legendbtn").setAttribute("aria-expanded", "false");
  panel.innerHTML = panelHtml(n); panel.classList.add("open");
  panel.querySelector(".close").onclick = () => select(null);
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const m = view.byId.get(b.dataset.go); if (m){ ensureVisible(m); select(m, true); } });
  panel.querySelector("[data-act=focus]").onclick = () => setFocus(n, focusDepth);
  panel.querySelector("[data-act=path]").onclick = () => { const set = ancestors(n);
    pathTo = new Set([...set].filter(id => id === n.id || !SOLID.has(view.byId.get(id).state))); dirty = true;
    fitTo(view.nodes.filter(m => pathTo.has(m.id) && visible(m)).map(m => ({x: m.x, y: m.y, r: m.r + 60}))); };
  panel.querySelector("[data-act=centre]").onclick = () => centreOn(n);
  if (centre) centreOn(n);
}
function centreOn(n){
  const k = Math.max(cam.k, 1.1), wide = W > 760, sx = wide ? (W - 390) / 2 : W / 2, sy = wide ? H / 2 : H * .3;
  camTo({k, x: sx - n.x * k, y: sy - n.y * k}, 460);
}
function ensureVisible(n){
  let changed = false;
  if (!visible(n)){ hidden.delete(n.state); if (n.state === "planned"){ showPlanned = true; $("#showPlanned").checked = true; }
    if (focus && !focus.set.has(n.id)) focus = null; renderStates(); changed = true; }
  if (layout === "overview" || changed) setLayout(layout === "overview" ? store.get("conceptLayout", "map") : layout, {instant: layout !== "overview"});
}
function setFocus(n, depth, quiet = false){
  focus = n ? {node: n, set: neighbourhood(n, depth)} : null; focusDepth = depth || focusDepth;
  $("#focusbar").classList.toggle("on", !!n);
  if (n){ $("#focuslabel").innerHTML = `Around <b>${esc(n.name)}</b>`;
    document.querySelectorAll("#depths button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.depth === focusDepth))); }
  if (!quiet && layout !== "overview") setLayout(layout);
  if (n) select(n);
}
function panelHtml(n){
  const [, label, desc] = stateInfo(n.state);
  const item = id => { const m = view.byId.get(id); if (!m) return "";
    return `<li><button data-go="${esc(id)}"><span class="dot" style="background:var(--${m.state})"></span>${esc(m.name)}<span class="sub" style="margin-left:auto">${esc(stateInfo(m.state)[1])}</span></button></li>`; };
  const list = (ids, empty) => ids.length ? `<ul>${ids.map(item).join("")}</ul>` : `<div class="sub">${empty}</div>`;
  const ev = n.evidence.length ? n.evidence.slice().reverse().map(e =>
    `<div class="ev" style="border-color:var(--${e.state})"><b>${esc(stateInfo(e.state)[1])}</b> · ${esc(e.source || "")}${e.confidence !== undefined ? ` · ${esc(e.confidence)}% sure` : ""}<span class="sub">${esc(e.date || "")}${e.note ? " · " + esc(e.note) : ""}</span></div>`).join("")
    : `<div class="sub">${n.implied ? "No direct evidence: counted as held because what builds on it is solid." : "No evidence yet."}</div>`;
  return `<button class="close" aria-label="Close">×</button>
    <div class="state" style="color:var(--${n.state})">${esc(label)}${n.unlocks ? ` · opens ${n.unlocks} more` : ""}</div>
    <h2>${esc(n.name)}</h2>
    <div class="sub">${esc(view.tracks[n.track] || n.track)} · ${esc(pretty(n.group))}${n.kind === "theory" ? " · theory" : ""}${n.shared ? '<span class="tag" title="Not specific to one language: it counts for any language you learn">general idea</span>' : ""}</div>
    <div class="sub" style="margin-top:4px">${esc(desc)}</div>
    ${n.can ? `<div class="can">${esc(n.can)}</div>` : ""}
    ${n.action ? `<div class="next"><b>Next step</b><code>${esc(n.action)}</code></div>` : ""}
    <div class="actions"><button class="btn" data-act="focus">Focus here</button><button class="btn" data-act="path">What I still need</button><button class="btn" data-act="centre">Centre</button></div>
    <h3>Needs first (${n.requires.length})</h3>${list(n.requires, "Nothing: a starting point.")}
    <h3>Leads to (${n.dependents.length})</h3>${list(n.dependents, "Nothing builds on it yet.")}
    <h3>Lesson</h3><div>${n.lesson ? `<code>teach me ${esc(n.lesson)}</code>` : '<span class="sub">none</span>'}</div>
    <h3>Exercises (${n.exercises.length})</h3>${n.exercises.length ? "<ul>" + n.exercises.map(x => `<li style="padding:3px 6px">${esc(x)}${n.due.includes(x) ? ' <span class="tag" style="color:var(--due);border-color:var(--due)">redo due</span>' : ""}</li>`).join("") + "</ul>" : '<div class="sub">none</div>'}
    <h3>Evidence</h3>${ev}`;
}

// ------------------------------------------------------------------ chrome: crumbs, next up, legend, search
function renderCrumbs(){
  const parts = [`<button data-c="all" title="Back to the overview">${esc(view.label)}</button>`];
  if (openGroup && layout !== "overview") parts.push(`<span class="sep">›</span><button data-c="group">${esc(pretty(openGroup))}</button>`);
  $("#crumbs").innerHTML = parts.join("");
  $("#crumbs [data-c=all]").onclick = () => { openGroup = null; setLayout("overview"); };
  const g = $("#crumbs [data-c=group]"); if (g) g.onclick = () => fitCurrent();
}
function renderNext(){
  const box = $("#nextup"); if (store.get("nextHidden", false) || !view.next.length){ box.style.display = "none"; return; }
  box.style.display = "";
  box.innerHTML = `<button class="x" aria-label="Hide">×</button><h2>Next up</h2>` + view.next.map(x => { const n = view.byId.get(x.id); if (!n) return "";
    return `<button class="row" data-id="${esc(n.id)}"><span class="dot" style="background:var(--${n.state})"></span><span><b>${esc(n.name)}</b><br><span class="sub">${esc(x.action)}</span></span></button>`; }).join("");
  box.querySelector(".x").onclick = () => { store.set("nextHidden", true); box.style.display = "none"; };
  box.querySelectorAll(".row").forEach(b => b.onclick = () => { const n = view.byId.get(b.dataset.id); openGroup = n.group; ensureVisible(n); select(n, true); });
}
function renderStates(){
  const counts = {}; for (const n of view.nodes) counts[n.state] = (counts[n.state] || 0) + 1;
  $("#states").innerHTML = STATES.filter(s => counts[s[0]]).map(([s, label, desc]) =>
    `<button class="chip" data-s="${s}" aria-pressed="${!(hidden.has(s) || (s === "planned" && !showPlanned))}"><span class="dot" style="background:var(--${s})"></span><span>${label}<span class="desc">${desc}</span></span><span class="n">${counts[s]}</span></button>`).join("");
  document.querySelectorAll("#states .chip").forEach(b => b.onclick = () => { const s = b.dataset.s;
    if (s === "planned"){ showPlanned = !showPlanned; $("#showPlanned").checked = showPlanned; store.set("planned", showPlanned); }
    else { hidden.has(s) ? hidden.delete(s) : hidden.add(s); store.set("hidden", [...hidden]); }
    renderStates(); setLayout(layout); });
}
function renderKeys(){
  const shared = view.nodes.some(n => n.shared), names = Object.values(view.tracks);
  const sharedLine = shared ? `<span class="dot" style="border:1.5px dashed var(--muted)"></span> dashed ring: a <b>general idea</b> (Big-O, two pointers, recursion), not specific to ${names.length > 1 ? "one language" : esc(names[0])}; if you learn another language later, it already counts there<br>` : "";
  $("#keys").innerHTML = (layout === "overview"
    ? "Each circle is a module. Its ring shows how much of it you hold, in the state colours; the number is solid / total. Lines show which modules lead to which. Click a module to open it.<br>"
    : `Bigger dot: more builds on it. Arrow: "needed for".<br>${sharedLine}`)
    + "<kbd>drag</kbd> move · <kbd>scroll</kbd> zoom · <kbd>double-click</kbd> focus<br><kbd>/</kbd> search · <kbd>O</kbd> <kbd>M</kbd> <kbd>L</kbd> views · <kbd>F</kbd> fit · <kbd>Esc</kbd> back";
}
const search = $("#search"), results = $("#results"); let hits = [], hit = 0;
function runSearch(){
  const q = search.value.trim().toLowerCase(); if (!q){ results.style.display = "none"; hits = []; return; }
  hits = view.nodes.map(n => { const i = n.name.toLowerCase().indexOf(q), hay = (n.name + " " + n.id + " " + n.group + " " + (n.can || "")).toLowerCase();
      return {n, s: i === 0 ? 0 : i > 0 ? 1 : hay.includes(q) ? 2 : 9}; })
    .filter(h => h.s < 9).sort((a, b) => a.s - b.s || a.n.name.localeCompare(b.n.name)).slice(0, 12).map(h => h.n);
  hit = 0; renderHits();
}
function renderHits(){
  results.innerHTML = hits.length ? hits.map((n, i) => `<button role="option" class="${i === hit ? "on" : ""}" data-i="${i}"><span class="dot" style="background:var(--${n.state})"></span><span>${esc(n.name)}<br><span class="sub">${esc(pretty(n.group))} · ${esc(stateInfo(n.state)[1])}</span></span></button>`).join("")
    : '<div class="sub" style="padding:8px">No concept matches.</div>';
  results.style.display = "block"; results.querySelectorAll("button").forEach(b => b.onclick = () => choose(hits[+b.dataset.i]));
}
function choose(n){ if (!n) return; results.style.display = "none"; search.blur(); ensureVisible(n); select(n, true); }
search.addEventListener("input", runSearch);
search.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ hit = Math.min(hits.length - 1, hit + 1); renderHits(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ hit = Math.max(0, hit - 1); renderHits(); e.preventDefault(); }
  else if (e.key === "Enter") choose(hits[hit]);
  else if (e.key === "Escape"){ search.value = ""; runSearch(); search.blur(); } });
document.addEventListener("click", e => { if (!$("#searchwrap").contains(e.target)) results.style.display = "none"; });

// ------------------------------------------------------------------ guide: four short steps, once
const GUIDE = [
  {title: "Your map of what you know", text: () => `This is your ${esc(view.label)} track. Each circle is a module; its coloured ring shows how much of it you already hold.`, target: null},
  {title: "Open a module", text: () => "Click a module to see its concepts. Map groups them by module; Flow shows what leads to what, left to right.", target: "#layouts"},
  {title: "Start here", text: () => "Next up lists what you can do now. Purple means ready: everything it needs is solid.", target: "#nextup"},
  {title: "Details when you want them", text: () => "Hover for a summary, click for the full story: what it lets you do, your next step, your evidence. Press / to search; ? brings this guide back.", target: "#searchwrap"}];
function showGuide(i){
  const g = $("#guide"); document.querySelectorAll(".lit-target").forEach(e => e.classList.remove("lit-target"));
  if (i >= GUIDE.length){ g.classList.remove("on"); store.set("guided", true); return; }
  const step = GUIDE[i];
  g.innerHTML = `<h2>${step.title}</h2><p>${step.text()}</p><div class="foot"><span class="steps">${i + 1} of ${GUIDE.length}</span><button class="btn" data-g="skip">Skip</button><button class="btn" data-g="next" style="border-color:var(--accent);color:var(--accent)">${i === GUIDE.length - 1 ? "Done" : "Next"}</button></div>`;
  g.classList.add("on");
  const t = step.target && $(step.target);
  if (t && t.offsetParent){ t.classList.add("lit-target"); const r = t.getBoundingClientRect();
    g.style.left = Math.min(innerWidth - 336, Math.max(12, r.left)) + "px";
    g.style.top = (r.top < innerHeight / 2 ? r.bottom + 14 : Math.max(12, r.top - g.offsetHeight - 14)) + "px"; }
  else { g.style.left = (innerWidth / 2 - 160) + "px"; g.style.top = Math.max(90, innerHeight / 2 - 80) + "px"; }
  g.querySelector("[data-g=next]").onclick = () => showGuide(i + 1);
  g.querySelector("[data-g=skip]").onclick = () => showGuide(GUIDE.length);
}

// ------------------------------------------------------------------ controls and start
function setView(key){
  store.set("view", key); view = buildView(key); selected = hover = focus = pathTo = null; openGroup = null;
  $("#panel").classList.remove("open"); $("#focusbar").classList.remove("on");
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === key)));
  $("#summaryhead").textContent = view.label; $("#summary").textContent = view.summary; document.title = `Concept graph · ${view.label}`;
  const ov = overviewPositions(); for (const m of view.modules){ const p = ov.get(m.id); if (p){ m.x = p.x; m.y = p.y; } }
  renderStates(); renderNext();
  setLayout(layout, {instant: true});
}
$("#views").innerHTML = Object.entries(DATA.views).map(([k, v]) => `<button data-view="${k}" title="${esc(v.summary)}">${esc(v.label)}</button>`).join("");
if (Object.keys(DATA.views).length < 2) $("#views").style.display = "none";
document.querySelectorAll("#views button").forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll("#layouts button").forEach(b => b.onclick = () => { const l = b.dataset.layout; if (l !== "overview") store.set("conceptLayout", l); setLayout(l); });
document.querySelectorAll("#depths button").forEach(b => b.onclick = () => focus && setFocus(focus.node, +b.dataset.depth));
$("#unfocus").onclick = () => setFocus(null);
$("#fit").onclick = () => fitCurrent();
$("#relayout").onclick = () => { store.set("pos:" + view.key, {}); setLayout(layout); };
$("#zin").onclick = () => zoomAt(W/2, H/2, 1.3); $("#zout").onclick = () => zoomAt(W/2, H/2, 1/1.3);
$("#showPlanned").checked = showPlanned;
$("#showPlanned").onchange = e => { showPlanned = e.target.checked; store.set("planned", showPlanned); renderStates(); setLayout(layout); };
$("#showRegions").onchange = e => { showRegions = e.target.checked; dirty = true; };
$("#legendbtn").onclick = () => { const o = $("#legend").classList.toggle("open"); $("#legendbtn").setAttribute("aria-expanded", String(o)); if (o) select(null); };
$("#help").onclick = () => showGuide(0);
$("#theme").onclick = () => { const r = document.documentElement; r.dataset.theme = isDark() ? "light" : "dark"; store.set("theme", r.dataset.theme); readColours(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColours);
document.addEventListener("keydown", e => {
  if (e.target === search) return;
  const key = e.key.toLowerCase();
  if (e.key === "/"){ e.preventDefault(); search.focus(); }
  else if (e.key === "Escape"){ if ($("#guide").classList.contains("on")) showGuide(GUIDE.length); else if (pathTo){ pathTo = null; dirty = true; }
    else if (focus) setFocus(null); else if (selected) select(null); else if (layout !== "overview"){ openGroup = null; setLayout("overview"); } }
  else if (key === "f") fitCurrent();
  else if (key === "o") setLayout("overview");
  else if (key === "m"){ store.set("conceptLayout", "map"); setLayout("map"); }
  else if (key === "l"){ store.set("conceptLayout", "flow"); setLayout("flow"); }
  else if (e.key === "+" || e.key === "=") zoomAt(W/2, H/2, 1.25);
  else if (e.key === "-") zoomAt(W/2, H/2, .8);
});
function resize(){
  DPR = window.devicePixelRatio || 1; W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); dirty = true;
  if (view && !userMoved) fitCurrent(false);
}
new ResizeObserver(resize).observe(canvas);
const savedTheme = store.get("theme", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
readColours(); resize();
setView(DATA.views[store.get("view", DATA.default)] ? store.get("view", DATA.default) : DATA.default);
requestAnimationFrame(loop);
if (!store.get("guided", false)) setTimeout(() => showGuide(0), 500);
</script>
</body>
