name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python dojo.py install
      - name: Changed files (personal data, secrets, syntax, changed exercises)
        run: python tools/check.py --base "origin/${{ github.base_ref || 'main' }}"
        if: github.event_name == 'pull_request'
      - name: Every exercise verifies
        run: python dojo.py verify
